name: Vita
# PCSX ReArcade's VPK (vitaGL selector + NEON executable), release flags.
# A v* tag also publishes it as a GitHub Release, with the notes in
# docs/releases/<tag>.md.
# ROM-based gates (byte-identical replays, MAME comparisons) cannot run here:
# tests/run_local_gates.sh runs them on a machine with the ROMs.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpk:
    runs-on: ubuntu-24.04
    outputs:
      short: ${{ steps.rev.outputs.short }}
    container:
      # Pinned: a new SDK can change code generation (the H8 batch loop is
      # sensitive to it). Move the tag on purpose.
      image: vitasdk/vitasdk:2026.08-20260925
      # The image's default user cannot write the runner's workspace mount.
      options: --user root
    steps:
      - name: Host tools
        # xxd: arcade-shelf embeds its font with it.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends xxd
      - uses: actions/checkout@v5
      - name: Submodules
        run: |
          # GIT_VERSION and the vitaGL build run git in the container.
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1 deps/libchdr deps/libretro-common
          # arcade-shelf builds its font from its own imgui submodule.
          git submodule update --init --recursive --depth 1 deps/arcade-shelf
      - name: vitaGL cache
        uses: actions/cache@v4
        with:
          path: build/vita-deps/vitaGL
          key: vitagl-2026.08-20260925-${{ hashFiles('tools/vita-harness/build_vitagl.py', 'tools/vita-harness/patches/vitagl-*.patch') }}
      - name: Build
        run: |
          # A tag vX.Y names the build and gives param.sfo APP_VER 0X.Y0.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}; major=${v%%.*}; minor=${v#*.}; minor=${minor%%.*}
            set -- VERSION="$GITHUB_REF_NAME" \
              APP_VER="$(printf '%02d' "$major").$(printf '%-2s' "$minor" | tr ' ' 0)"
          fi
          make -f Makefile.vita ARCADE_SYSTEM12=1 RELEASE=1 "$@" -j"$(nproc)"
      - name: Short commit
        id: rev
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify package and checksum
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          package = Path('pcsx-rearcade.vpk')
          with ZipFile(package) as archive:
              assert archive.testzip() is None, 'corrupt VPK member'
              for name in ('eboot.bin', 'eboot_neon.bin', 'sce_sys/param.sfo'):
                  assert archive.getinfo(name).file_size > 0, name
              assert archive.read('eboot.bin') != archive.read('eboot_neon.bin'), 'duplicate renderer executable'
          Path('pcsx-rearcade.vpk.sha256').write_text(
              hashlib.sha256(package.read_bytes()).hexdigest() + '  ' + package.name + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pcsx-rearcade-${{ steps.rev.outputs.short }}
          path: |
            pcsx-rearcade.vpk
            pcsx-rearcade.vpk.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: vpk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pcsx-rearcade-${{ needs.vpk.outputs.short }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pcsx-rearcade.vpk pcsx-rearcade.vpk.sha256 \
            --title "PCSX ReArcade $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
